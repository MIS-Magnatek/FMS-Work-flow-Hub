<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnatek FMS Workflow Hub</title>
<style>
  :root{
    --sky:#d6eeff;
    --sky-deep:#aee0ff;
    --red:#c8102e;
    --black:#1a1a1a;
    --yellow:#f6b40e;
    --ink:#1f2937;
    --muted:#5b6b7a;
    --card:#ffffff;
    --line:#c9e4f7;
    --ok:#1a9e5c;
    --warn:#e0972a;
    --late:#c8102e;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%, #eef8ff 340px, #f6fbff 100%);
    color:var(--ink);
    min-height:100vh;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;
    background:linear-gradient(135deg,#073b66 0%,#0a6fa8 55%,#123d63 100%);
    color:#fff;
    border-bottom:5px solid var(--red);
    box-shadow:0 5px 18px rgba(7,59,102,.22);
    position:relative;
    overflow:hidden;
  }
  .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .brand-logo{height:42px;width:auto;background:rgba(255,255,255,.97);padding:5px 10px;border-radius:8px;display:block;box-shadow:0 3px 12px rgba(0,0,0,.16);}
  .modebadge{
    font-size:9.5px;padding:3px 8px;border-radius:20px;
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.18);
    position:relative;z-index:1;letter-spacing:.2px;
  }
  header::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:120px;top:-210px;background:rgba(255,255,255,.08);}
  header::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-40px;bottom:-135px;background:rgba(246,180,14,.16);}
  main{max-width:1180px;margin:0 auto;padding:24px 20px 60px;}
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .crumbs button{background:none;border:none;color:#0a6fa8;cursor:pointer;font-size:13px;padding:0;}
  .crumbs button:hover{text-decoration:underline;}
  h1{font-size:22px;margin:0 0 4px;}
  h2{font-size:18px;margin:0 0 14px;}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;}

  .fms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .fms-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden;}
  .fms-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(10,111,168,.14);}
  .fms-card.locked{cursor:not-allowed;opacity:.55;}
  .fms-card.locked:hover{transform:none;box-shadow:none;}
  .fms-card .badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;margin-bottom:10px;}
  .fms-card h3{font-size:14.5px;margin:0 0 4px;}
  .fms-card p{font-size:12px;color:var(--muted);margin:0;}
  .fms-card .stat{margin-top:10px;font-size:11.5px;color:#0a6fa8;font-weight:600;}
  .fms-card .pill{position:absolute;top:10px;right:10px;font-size:10px;background:var(--yellow);color:#3a2b00;padding:3px 8px;border-radius:20px;font-weight:700;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .btn{border:none;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--red);color:#fff;}
  .btn:hover{opacity:.9;}
  .btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.small{padding:6px 11px;font-size:12px;}
  .btn.ghost{background:transparent;color:#0a6fa8;border:1px solid #aee0ff;}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .kpi .num{font-size:22px;font-weight:800;}
  .kpi .lbl{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .kpi.ok .num{color:var(--ok);}
  .kpi.warn .num{color:var(--warn);}
  .kpi.late .num{color:var(--late);}

  table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  th,td{padding:10px 12px;text-align:left;font-size:12.8px;border-bottom:1px solid #eef3f7;}
  th{background:var(--sky-deep);color:#053a57;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;}
  tr:hover td{background:#f7fbff;cursor:pointer;}
  .status-chip{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block;}
  .status-chip.pending{background:#eef1f4;color:#5b6b7a;}
  .status-chip.progress{background:#fff3d9;color:#8a5a00;}
  .status-chip.done{background:#e2f6ec;color:var(--ok);}
  .status-chip.late{background:#fde3e6;color:var(--late);}
  .status-chip.cancelled{background:#f1f1f1;color:#888;}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:6px;}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid #c9d6df;border-radius:8px;font-size:13.5px;background:#fbfdff;font-family:inherit;}
  textarea{resize:vertical;min-height:44px;}
  input:focus,select:focus,textarea:focus{outline:2px solid #8fd0ff;border-color:#8fd0ff;}

  .client-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 20px;margin-bottom:18px;
  }
  .client-card .client-name{font-size:19px;font-weight:800;color:var(--ink);}
  .client-card .client-name .city{font-weight:600;color:#0a6fa8;}
  .client-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:12px;}
  .client-grid .item .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .client-grid .item .v{font-size:13.5px;font-weight:600;margin-top:2px;}
  .client-grid .item .v.missing{color:var(--late);font-weight:600;}

  .stage{display:flex;gap:14px;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;background:#fff;position:relative;}
  .stage.section-head{background:var(--black);color:#fff;justify-content:center;font-weight:700;letter-spacing:.5px;font-size:12.5px;padding:8px;border-radius:9px;}
  .stage-badge{min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
  .stage-body{flex:1;}
  .stage-title{font-size:14px;font-weight:700;margin-bottom:2px;}
  .stage-meta{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
  .stage-meta b{color:#0a6fa8;}
  .stage-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .stage-fields .ro{font-size:13px;padding:8px 0;color:var(--ink);}
  .stage-fields .full{grid-column:1/-1;}
  .delay-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;}
  .delay-tag.none{background:#e2f6ec;color:var(--ok);}
  .delay-tag.late{background:#fde3e6;color:var(--late);}

  .stage.done-row{padding:10px 16px;align-items:center;background:#f7fbf9;border-color:#d9ece2;}
  .stage.done-row.was-late{background:#fdf3f3;border-color:#f3c6cb;}
  .stage.done-row .stage-badge{background:var(--ok)!important;font-size:15px;}
  .stage.done-row.was-late .stage-badge{background:var(--late)!important;}
  .stage.done-row .stage-title{font-size:13px;margin-bottom:0;}
  .stage.done-row .stage-meta{margin-bottom:0;}
  .stage.done-row .done-date{font-size:12px;color:var(--ok);font-weight:700;margin-left:auto;white-space:nowrap;text-align:right;}
  .stage.done-row.was-late .done-date{color:var(--late);}
  .stage.active{border:2px solid #0a6fa8;box-shadow:0 4px 16px rgba(10,111,168,.12);}
  .stage.active.overdue{border:2px solid var(--late);box-shadow:0 4px 16px rgba(200,16,46,.18);background:#fffaf9;}
  .stage.locked{opacity:.55;padding:10px 16px;align-items:center;background:#fafbfc;}
  .stage.locked .stage-badge{background:#b7c2ca!important;}
  .stage.locked .stage-title{font-size:13px;margin-bottom:0;}
  .stage.locked .lock-note{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;}
  .cancelled-banner{background:#fdecec;border:1px solid #f3b8bd;color:var(--late);padding:14px 16px;border-radius:var(--radius);font-size:13.5px;margin-bottom:16px;font-weight:600;}
  .overdue-banner{background:#fdecec;border:1px solid #f3b8bd;color:var(--late);padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:10px;font-weight:700;}

  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px;}
  .datasrc{font-size:11.5px;color:var(--muted);background:#f0f8ff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .datasrc b{color:#0a6fa8;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="brand-logo" id="brandLogo" alt="Magnatek — Better things for Better care" />
  </div>
  <div class="modebadge" id="modeBadge">Demo data · stored in this browser</div>
</header>

<main>
  <div class="crumbs" id="crumbs"></div>
  <div id="app"></div>
  <footer>FMS Workflow Hub · pilot build (OTD FMS live, more processes coming) · data stored locally until connected to Google Sheets</footer>
</main>

<script>
/* ============================================================
   FMS WORKFLOW HUB — config-driven engine (v3)
   Each case tracks an explicit stage cursor (caseData.activeStageNum)
   and a traversal history (caseData.completedOrder), so "what's the
   current stage" is never recomputed/guessed — it's stored directly.
   Add a new FMS by pushing a config object into FMS_CONFIGS and
   giving it a resolveNext(stage, caseData) function.
   ============================================================ */

const STORAGE_PREFIX = "fms_hub_";
// To go live on Google Sheets: deploy the paired Apps Script web app
// (see fms-workflow-hub-appsscript.gs) to EACH spreadsheet you're using —
// once for "ops", and again for "hr" if you want HR/Payroll data kept in
// a separate, more tightly-shared spreadsheet — and paste each /exec URL
// into the matching slot below. Every FMS config declares its own
// sheetGroup ("ops" by default, "hr" for Recruitment/Salary/Exit/Vacancy);
// that decides which of these two URLs it reads/writes through.
const GAS_URLS = {
  ops: "https://script.google.com/a/macros/magnatek.in/s/AKfycbw7mcwGyjpuiIXONEmLtflvk544ji-uergnNcIIWCVXk-PW2Pzph2BXNfR6MAzHaWChIg/exec", // Sales, Service, Purchase, Tender, GSTR, etc.
  hr:  "https://script.google.com/a/macros/magnatek.in/s/AKfycbx4KOPUckaHoxYSaVGFY_Y0Sy6LKHfrvTcsRWpaYasv8FKI7Y_xofK6EEnCGOE4KZ43/exec", // separate spreadsheet for HR/Payroll-sensitive FMS
};
function gasUrlFor(fmsId){
  const cfg = FMS_CONFIGS.find(c=>c.id===fmsId);
  const group = (cfg && cfg.sheetGroup) || "ops";
  return GAS_URLS[group] || "";
}

/* ---------- Doer-based permissions (real Google sign-in) ----------
   Requires each Apps Script deployment to use "Execute as: User accessing
   the web app" (see fms-workflow-hub-appsscript.gs header comment) so the
   backend can report the caller's real email via a "whoami" call.
   Map each role/doer name that appears in stage.doer strings to the real
   email addresses of the people who fill that role. Leave both lists
   empty to keep the app open to everyone (today's behavior) until you're
   ready to switch this on — once either list has an entry, permission
   checks activate for everyone. */
const DOER_EMAILS = {
  "HR": ["career@magnatek.in"],
  "HR1": ["career@magnatek.in"],
  "Admin Manager": ["contact@magnatek.in"],
  "Admin Manager Vinay": ["contact@magnatek.in"],
  "AM": ["contact@magnatek.in"],
  "Admin Executive (Waseem)": ["contact@magnatek.in"],
  "Admin Executive Waseem": ["contact@magnatek.in"],
  "Auditor (Sunil)": ["Sunil@rsbajaj.co.in"],
  "Auditor Sunil": ["Sunil@rsbajaj.co.in"],
  "Mam": ["ms11minu@gmail.com"],
  "Management": ["ms11minu@gmail.com"],
  "Mngmt": ["ms11minu@gmail.com"],
  "Telecaller": ["sales@magnatek.in"],
  "TE": ["sales@magnatek.in"],
  "Tender Executive": ["sales@magnatek.in"],
  "DEO": ["sales@magnatek.in"],
  "CRE": ["sales@magnatek.in"],
  "Sales Head": ["sales@magnatek.in"], // not an exact title match in your list — mapped to the sales team inbox, flag if this should be someone specific
  "OSC": ["service@magnatek.in"],
  "Office Service Coordinator (OSC)": ["service@magnatek.in"],
  "SM": ["stores@magnatek.in"],
  "Service Manager": ["stores@magnatek.in"],
  "Service Manager (SM)": ["stores@magnatek.in"],
  "PM": ["stores@magnatek.in"],
  "PS": ["stores@magnatek.in"],
  "Production Supervisor": ["stores@magnatek.in"],
  "ASH": ["stores@magnatek.in"],
  "Asst. SH": ["stores@magnatek.in"],
  "Assistant Service Manager (ASM)": ["stores@magnatek.in"],
  "SH": ["stores@magnatek.in"],
  "ST": ["stores@magnatek.in"],
  "Stores Incharge": ["stores@magnatek.in"],
  "Sundar (Recording)": ["stores@magnatek.in"], // not in your list — best guess, flag if wrong
  // Left unmapped on purpose — these are generic/varying roles, not one
  // fixed person, so stages assigned to them show view-only to everyone
  // except MIS until you tell me who should actually cover them:
  // "Concerned Department", "HOD's", "OB", "Staff"
};
const ADMIN_EMAILS = [
  "mis@magnatek.in",
];

let currentUserEmail = null;
async function loadCurrentUser(){
  const url = GAS_URLS.ops || GAS_URLS.hr;
  if (!url) return; // demo mode — no identity system available yet
  try {
    const res = await jsonp(url, {action:"whoami"});
    currentUserEmail = (res && res.email) || null;
  } catch(e){ currentUserEmail = null; }
}
function permissionsConfigured(){
  return Object.keys(DOER_EMAILS).length > 0 || ADMIN_EMAILS.length > 0;
}
function isAdmin(){
  if (!permissionsConfigured()) return true; // not set up yet — don't block anyone
  return !!currentUserEmail && ADMIN_EMAILS.includes(currentUserEmail);
}
function canActOnStage(stage){
  if (!permissionsConfigured()) return true;
  if (currentUserEmail && ADMIN_EMAILS.includes(currentUserEmail)) return true;
  if (!currentUserEmail) return false;
  return splitDoers(stage.doer).some(role => (DOER_EMAILS[role]||[]).includes(currentUserEmail));
}

const STAGE_COLORS = ["#c8102e","#0a6fa8","#f6b40e","#1a9e5c","#7a4fd6","#e0972a"];
function stageColor(i){ return STAGE_COLORS[i % STAGE_COLORS.length]; }

/* ---------- FMS CONFIGS ---------- */
const FMS_CONFIGS = [
  {
    id: "otd",
    name: "Sales Order to Delivery FMS",
    badge: "OT",
    full: "Purpose: to ensure On-Time Delivery (OTD)",
    caseLabel: "PO Number",
    headlineKeys: ["clientName","city"],
    listColumns: [
      {key:"poNumber", label:"PO Number"}, {key:"clientName", label:"Client"},
      {key:"productType", label:"Product Type"}, {key:"city", label:"City"}, {key:"poDate", label:"PO Date"}
    ],
    live: true,
    intake: [
      {key:"poNumber", label:"PO Number", required:true},
      {key:"poDate", label:"PO Date", type:"date", required:true},
      {key:"clientName", label:"Client Name", required:true},
      {key:"city", label:"City"},
      {key:"productDesc", label:"Product Description"},
      {key:"productType", label:"Product Type", type:"select", required:true,
       options:["Table","Lights","Pendent","Both Table & Lights","Both Table & Pendent","Both Table, Lights & Pendent"]},
      {key:"contactPerson", label:"Contact Person", required:true},
      {key:"contactDetails", label:"Contact Details (phone/email)", required:true},
    ],
    stages: [
      {num:1, title:"PO received & checked", doer:"Sales Head/Mngmt", how:"Checklist, Quotation", sla:0.33,
       decision:{key:"poOk", label:"PO OK?", options:["OK","Needs revision","Cancelled"]}},
      {num:2, title:"Revised PO obtained", doer:"DEO/Telecaller", how:"Checklist, Mail", sla:3},
      {num:3, title:"Production Checklist sent to factory", doer:"OSC", how:"Template", sla:1},
      {num:4, title:"Advance payment received", doer:"CRE", how:"Checklist, Mail, Registers, Excel, Cheque Book", sla:0.33},
      {num:5, title:"OT dimensions follow-up", doer:"OSC", how:"Phone/Mail/Checklist with photo", sla:3,
       decision:{key:"dimensionMismatch", label:"Dimension mismatch found?", options:["No","Yes"]}},
      {num:6, title:"Realign customer on alternate light", doer:"CRE", how:"Phone/Mail", sla:3},
      {num:7, title:"Base plate details sent", doer:"OSC", how:"Phone/Mail/Checklist", sla:3},
      {num:8, title:"Plate made", doer:"Production Supervisor / OSC", how:"Phone/Mail/Checklist", sla:6,
       decision:{key:"plateDispatch", label:"Plate Dispatch?", options:["Yes","No"]},
       remarksRequiredWhen:(caseData)=> caseData.decision_plateDispatch === "No"},
      {num:9, title:"Plate dispatch", doer:"OSC / CRE", how:"Checklist", sla:1},
      {num:10, title:"Dispatch date aligned, PI mailed", doer:"CRE & OSC", how:"Production Checklist/Mail", sla:2},
      {num:11, title:"Demo video recorded & sent", doer:"SH/Asst. SH", how:"Mobile", sla:1},
      {num:12, title:"Product ready, PI/Invoice mailed", doer:"CRE & OSC", how:"Checklist, Mail, Phone", sla:1},
      {num:13, title:"Balance payment received", doer:"CRE", how:"Checklist, G-Form, Mail, Registers", sla:1},
      {num:14, title:"Dispatch date mailed, Eway bill raised", doer:"CRE, OSC", how:"Checklist, Mail", sla:1},
      {num:15, title:"LR tracked in transit", doer:"OSC & CRE", how:"Transit, Mail", sla:4, sectionStart:"Post Dispatch"},
      {num:16, title:"COD cheque collected", doer:"CRE", how:"—", sla:1},
      {num:17, title:"Customer mailed re: delivery", doer:"CRE", how:"Mail", sla:1},
      {num:18, title:"Cheque received in Hyd office", doer:"CRE", how:"Mail", sla:1},
    ],
    // Explicit branch resolution — the only place non-linear jumps are decided.
    resolveNext(stage, caseData){
      const numbered = this.stages;
      const idx = numbered.findIndex(s=>s.num===stage.num);
      const linearNext = idx+1 < numbered.length ? numbered[idx+1].num : "END";
      if (stage.num===1){
        const d = caseData.decision_poOk;
        if (d==="Cancelled") return "CANCELLED";
        if (d==="Needs revision") return 2;
        return 3; // OK -> skip "revised PO" stage
      }
      if (stage.num===2) return 3;
      if (stage.num===4){
        const needsCeilingMount = /Lights|Pendent/.test(caseData.productType||"");
        // Pure Table orders sit on a surface, not the ceiling — no dimension
        // check, no base plate, no plate-making. Skip straight to dispatch prep.
        return needsCeilingMount ? 5 : 10;
      }
      if (stage.num===5){
        return caseData.decision_dimensionMismatch==="Yes" ? 6 : 7;
      }
      if (stage.num===6) return 7;
      if (stage.num===8){
        return caseData.decision_plateDispatch==="Yes" ? 9 : 10;
      }
      return linearNext;
    }
  },
  {
    id: "gstr1",
    name: "GSTR1 FMS",
    badge: "G1",
    full: "Purpose: to ensure GSTR1 sales returns are filed by the 7th of every month",
    caseLabel: "GSTR1 Filing",
    live: true,
    periodKey: "month", // which intake field holds the "YYYY-MM" the due-days are anchored to
    headlineKeys: ["month","company"],
    listColumns: [{key:"month", label:"Month"}, {key:"company", label:"Company"}],
    intake: [
      {key:"month", label:"Filing Month", type:"month", required:true},
      {key:"company", label:"Company", required:true},
    ],
    stages: [
      {num:1, title:"Invoice entry in Tally", doer:"Auditor Sunil", how:"GSTR1 Checklist", dueDay:6},
      {num:2, title:"Advance statement printout shown to Mngmt", doer:"Admin Manager Vinay", how:"GSTR1 Checklist", dueDay:6},
      {num:3, title:"File GSTR1", doer:"Admin Executive Waseem", how:"GSTR1 Checklist", dueDay:10},
      {num:4, title:"File printouts & show to Mngmt", doer:"Admin Executive Waseem", how:"GSTR1 Checklist", dueDay:12},
    ],
    resolveNext(stage){
      const idx = this.stages.findIndex(s=>s.num===stage.num);
      return idx+1 < this.stages.length ? this.stages[idx+1].num : "END";
    }
  },
  {
    id: "purchase",
    name: "Purchase FMS",
    badge: "PU",
    full: "Purpose: ensure material is purchased & issued on time for fast production, and vendor payments are made on time",
    caseLabel: "Indent No",
    live: true,
    startDateKey: "indentDate",
    headlineKeys: ["requisitionName","location"],
    listColumns: [
      {key:"indentNo", label:"Indent No"}, {key:"requisitionName", label:"Requisition Name"},
      {key:"location", label:"Location"}, {key:"indentDate", label:"Indent Date"},
      {key:"totalSkus", label:"SKUs"}, {key:"totalQty", label:"Total Qty"}
    ],
    intake: [
      {key:"indentNo", label:"Indent No", required:true},
      {key:"indentDate", label:"Indent Date", type:"date", required:true},
      {key:"requisitionName", label:"Requisition Name", required:true},
      {key:"location", label:"Location", required:true},
      {key:"totalSkus", label:"Total No. of SKUs"},
      {key:"totalQty", label:"Total Qty"},
    ],
    // numbering follows the source flowchart, which skips Stage 6
    stages: [
      {num:1, title:"Raise indent as per BOM (material, qty, dimensions, price)", doer:"Production Supervisor/PM", how:"Indent", sla:3},

/* ---------- storage layer (localStorage now, Apps Script-ready) ---------- */
const Store = {
  async list(fmsId){
    const url = gasUrlFor(fmsId);
    if (url) return jsonp(url, {action:"list", fms:fmsId});
    return JSON.parse(localStorage.getItem(STORAGE_PREFIX+fmsId) || "[]");
  },
  async save(fmsId, cases){
    const url = gasUrlFor(fmsId);
    if (url) return jsonp(url, {action:"save", fms:fmsId, data:JSON.stringify(cases)});
    localStorage.setItem(STORAGE_PREFIX+fmsId, JSON.stringify(cases));
  }
};
function jsonp(url, params){
  return new Promise((resolve,reject)=>{
    const cb = "cb_"+Date.now();
    window[cb] = (data)=>{ resolve(data); delete window[cb]; script.remove(); };
    const q = Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
    const script = document.createElement("script");
    script.src = url+"?callback="+cb+"&"+q;
    script.onerror = ()=>reject(new Error("Apps Script request failed"));
    document.body.appendChild(script);
  });
}
function dataSourceNote(cfg){
  const url = gasUrlFor(cfg.id);
  const groupLabel = (cfg.sheetGroup||"ops")==="hr" ? "HR/Payroll workbook" : "Operations workbook";
  const where = url
    ? `your linked Google Sheet (${groupLabel}), tab "<b>${cfg.id}</b>"`
    : `this browser's local storage, key "<b>${STORAGE_PREFIX}${cfg.id}</b>" (demo mode — not shared with other computers yet)`;
  return `<div class="datasrc">📍 Data for ${cfg.name} is being saved to ${where}.</div>`;
}

/* ---------- date/SLA helpers ---------- */
function addDays(dateStr, days){
  const d = new Date(dateStr);
  d.setHours(d.getHours() + Math.round(days*24));
  return d.toISOString().slice(0,10);
}
function today(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function findStage(cfg, num){ return cfg.stages.find(s=>s.num===num); }

function computePlanned(cfg, caseData, stageNum){
  const stage = findStage(cfg, stageNum);
  if (stage.plannedMode === "dueDateOffset"){
    const base = caseData[stage.baseKey] || today();
    return addDays(base, stage.offsetDays || 0);
  }
  if (stage.plannedMode === "followUpDate"){
    // Planned = whatever date was captured at the last call (e.g. "Next
    // Follow-Up Date"); only falls back to a computed date if nothing's
    // been captured yet (first time this stage is ever reached).
    const captured = caseData[stage.followUpSourceKey];
    if (captured) return captured;
    const base = caseData[stage.fallbackBaseKey] || caseData.createdAt || today();
    const days = stage.fallbackDaysKey ? (Number(caseData[stage.fallbackDaysKey]) || 0) : (stage.sla || 0);
    return addDays(base, days);
  }
  if (stage.dueDay){
    // Fixed calendar due date anchored to the case's own reference month —
    // doesn't shift based on when the previous stage was actually done.
    // monthOffset lets a stage's due date fall in a later month than the
    // case's reference month (e.g. payroll disbursal the month after).
    let [y,m] = (caseData[cfg.periodKey] || today().slice(0,7)).slice(0,7).split("-").map(Number);
    m += (stage.monthOffset || 0);
    while (m > 12){ m -= 12; y += 1; }
    return `${y}-${String(m).padStart(2,"0")}-${String(stage.dueDay).padStart(2,"0")}`;
  }
  const order = caseData.completedOrder || [];
  const idxInOrder = order.indexOf(stageNum);
  let baseDate = caseData[cfg.startDateKey||"poDate"] || caseData.createdAt || today();
  // base off the actual date of whichever stage precedes this one in the case's own history
  if (idxInOrder > 0){
    baseDate = caseData["actual_"+order[idxInOrder-1]] || baseDate;
  } else if (order.length && idxInOrder === -1){
    baseDate = caseData["actual_"+order[order.length-1]] || baseDate;
  }
  const slaDays = stage.slaKey ? (Number(caseData["num_"+stage.slaKey]) || stage.slaDefault || 0) : stage.sla;
  return addDays(baseDate, slaDays);
}
function delayDays(planned, referenceDate){
  return daysBetween(planned, referenceDate || today());
}

/* current stage the case is sitting at, defaulting to the first stage */
function activeStage(cfg, caseData){
  if (caseData.status === "Cancelled") return null;
  if (caseData.activeStageNum === null) return null; // finished
  const num = caseData.activeStageNum || cfg.stages[0].num;
  return findStage(cfg, num);
}
function isCaseComplete(cfg, caseData){
  return caseData.status !== "Cancelled" && caseData.activeStageNum === null && (caseData.completedOrder||[]).length > 0;
}
function isCaseCancelled(caseData){ return caseData.status === "Cancelled"; }
function caseIsOverdue(cfg, caseData){
  const stage = activeStage(cfg, caseData);
  if (!stage) return false;
  const planned = caseData["planned_"+stage.num] || computePlanned(cfg, caseData, stage.num);
  return delayDays(planned) > 0;
}

/* ---------- app state & routing ---------- */
let state = { view:"dashboard", fmsId:null, caseId:null };

function crumbLink(label, onClick){
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = onClick;
  return b;
}
function renderCrumbs(){
  const el = document.getElementById("crumbs");
  el.innerHTML = "";
  el.appendChild(crumbLink("FMS Hub", ()=>{ state.view="dashboard"; state.fmsId=null; render(); }));
  if (state.fmsId){
    const cfg = FMS_CONFIGS.find(c=>c.id===state.fmsId);
    el.append(" / ");
    el.appendChild(crumbLink(cfg.name, ()=>{ state.view="list"; state.caseId=null; render(); }));
  }
  if (state.view==="detail" && state.caseId) el.append(" / Case detail");
  if (state.view==="new") el.append(" / New case");
  if (state.view==="audit") el.append(" / Delay audit");
}

async function render(){
  renderCrumbs();
  const app = document.getElementById("app");
  if (state.view==="dashboard") return renderDashboard(app);
  if (state.view==="list") return renderList(app);
  if (state.view==="new") return renderNewCase(app);
  if (state.view==="detail") return renderDetail(app);
  if (state.view==="audit") return renderAudit(app);
}

function renderDashboard(app){
  app.innerHTML = `
    <h1>FMS Workflow Hub</h1>
    <div class="sub">Pick a process to log a case, track its stages, and see what's overdue. Built once as a generic engine — every process below plugs into the same tracker.</div>
    <div class="fms-grid" id="fmsGrid"></div>
  `;
  const grid = document.getElementById("fmsGrid");
  FMS_CONFIGS.forEach((cfg,i)=>{
    const card = document.createElement("div");
    card.className = "fms-card" + (cfg.live? "":" locked");
    card.innerHTML = `
      ${cfg.live? "": '<div class="pill">Coming soon</div>'}
      <div class="badge" style="background:${stageColor(i)}">${(cfg.badge||cfg.name).slice(0,2).toUpperCase()}</div>
      <h3>${cfg.name}</h3>
      <p>${cfg.full}</p>
      <div class="stat" id="stat_${cfg.id}"></div>
    `;
    if (cfg.live) card.onclick = ()=>{ state.view="list"; state.fmsId=cfg.id; render(); };
    grid.appendChild(card);
  });
  FMS_CONFIGS.filter(c=>c.live).forEach(async cfg=>{
    const cases = await Store.list(cfg.id);
    const open = cases.filter(c=>!isCaseComplete(cfg,c) && !isCaseCancelled(c)).length;
    const statEl = document.getElementById("stat_"+cfg.id);
    if (statEl) statEl.textContent = `${cases.length} case${cases.length===1?"":"s"} · ${open} open`;
  });
}

async function renderList(app){
  const cfg = FMS_CONFIGS.find(c=>c.id===state.fmsId);
  const cases = await Store.list(cfg.id);
  const openCount = cases.filter(c=>!isCaseComplete(cfg,c) && !isCaseCancelled(c)).length;
  const lateCount = cases.filter(c=>caseIsOverdue(cfg,c)).length;
  const doneCount = cases.filter(c=>isCaseComplete(cfg,c)).length;

  app.innerHTML = `
    <h1>${cfg.name} <span style="font-weight:400;color:var(--muted);font-size:15px;">— ${cfg.full}</span></h1>
    <div class="sub">Every ${cfg.caseLabel.toLowerCase()} moving through this process, with live Planned / Actual / Status / Delay tracking per stage.</div>
    ${dataSourceNote(cfg)}
    <div class="kpi-row">
      <div class="kpi"><div class="num">${cases.length}</div><div class="lbl">Total cases</div></div>
      <div class="kpi warn"><div class="num">${openCount}</div><div class="lbl">Open</div></div>
      <div class="kpi late"><div class="num">${lateCount}</div><div class="lbl">Running late</div></div>
      <div class="kpi ok"><div class="num">${doneCount}</div><div class="lbl">Completed</div></div>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="auditBtn">⚠ Delay audit</button>
      <button class="btn" id="newCaseBtn">+ New ${cfg.caseLabel}</button>
    </div>
    <div id="tableWrap"></div>
  `;
  document.getElementById("newCaseBtn").onclick = ()=>{ state.view="new"; render(); };
  document.getElementById("auditBtn").onclick = ()=>{ state.view="audit"; render(); };

  const wrap = document.getElementById("tableWrap");
  if (!cases.length){
    wrap.innerHTML = `<div class="card empty">No cases yet. Click "+ New ${cfg.caseLabel}" to log the first one.</div>`;
    return;
  }
  const columns = cfg.listColumns || cfg.intake.map(f=>({key:f.key, label:f.label}));
  const rows = cases.map(c=>{
    const cancelled = isCaseCancelled(c);
    const complete = isCaseComplete(cfg,c);
    const late = caseIsOverdue(cfg,c);
    const chip = cancelled? '<span class="status-chip cancelled">Cancelled</span>'
      : complete? '<span class="status-chip done">Completed</span>'
      : late? '<span class="status-chip late">Delayed</span>'
      : '<span class="status-chip progress">In progress</span>';
    return `<tr data-id="${c.id}">
      ${columns.map(col=>`<td>${c[col.key]||"—"}</td>`).join("")}
      <td>${chip}</td>
      <td>${isAdmin()? `<button class="btn small secondary" data-del="${c.id}" style="color:var(--late);">🗑</button>` : ""}</td>
    </tr>`;
  }).join("");
  wrap.innerHTML = `<table>
    <thead><tr>${columns.map(col=>`<th>${col.label}</th>`).join("")}<th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  wrap.querySelectorAll("tr[data-id]").forEach(tr=>{
    tr.onclick = (e)=>{
      if (e.target.closest("button[data-del]")) return;
      state.view="detail"; state.caseId=tr.dataset.id; state.caseEditMode=false; render();
    };
  });
  wrap.querySelectorAll("button[data-del]").forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const ok = await deleteCase(cfg.id, btn.dataset.del);
      if (ok) render();
    };
  });
}

function renderNewCase(app){
  const cfg = FMS_CONFIGS.find(c=>c.id===state.fmsId);
  app.innerHTML = `
    <h2>New ${cfg.caseLabel}</h2>
    ${dataSourceNote(cfg)}
    <div class="card">
      <div class="field-grid" id="intakeFields"></div>
      <div style="margin-top:14px;">
        <button class="btn" id="createBtn">Create case</button>
        <button class="btn secondary" id="cancelBtn">Cancel</button>
      </div>
    </div>
  `;
  const grid = document.getElementById("intakeFields");
  cfg.intake.forEach(f=>{
    const wrap = document.createElement("div");
    if (f.type === "select"){
      wrap.innerHTML = `<label>${f.label}${f.required? " *":""}</label>
        <select id="in_${f.key}">
          <option value="">— Select —</option>
          ${f.options.map(o=>`<option>${o}</option>`).join("")}
        </select>`;
    } else {
      const autoValue = f.auto ? new Date().toISOString().slice(0,16) : "";
      const autoAttr = f.auto ? " readonly" : "";
      wrap.innerHTML = `<label>${f.label}${f.required? " *":""}</label><input type="${f.type||"text"}" id="in_${f.key}" value="${autoValue}"${autoAttr} />`;
    }
    grid.appendChild(wrap);
  });
  document.getElementById("cancelBtn").onclick = ()=>{ state.view="list"; render(); };
  document.getElementById("createBtn").onclick = async ()=>{
    const data = { id:"c"+Date.now(), createdAt:today(), status:"Open", activeStageNum:cfg.stages[0].num, completedOrder:[] };
    if (cfg.id === "st_travel") data.uniqueKey = "STT-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-6);
    if (cfg.id === "tender"){
      data.timestamp = new Date().toISOString().slice(0,16);
      data.timestampDate = data.timestamp.slice(0,10);
      const existing = await Store.list(cfg.id);
      data.slNo = String(existing.length + 1);
    }
    let missing = false;
    cfg.intake.forEach(f=>{
      const input = document.getElementById("in_"+f.key);
      const v = input ? input.value.trim() : "";
      if (f.required && !v) missing = true;
      if (!(cfg.id === "st_travel" && f.key === "uniqueKey") && !(cfg.id === "tender" && (f.key === "timestamp" || f.key === "slNo"))) data[f.key] = v;
    });
    if (missing){ alert("Please fill all required fields — especially the client contact fields, so anyone picking up this case can reach the client."); return; }
    if (cfg.id === "pending_payment" && data.initialNextFollowUp) data["date_nextFollowUpDate"] = data.initialNextFollowUp;
    const cases = await Store.list(cfg.id);
    cases.push(data);
    await Store.save(cfg.id, cases);
    state.view="detail"; state.caseId=data.id; render();
  };
}

/** Generic case-summary card, built entirely from each FMS's own intake
 *  fields — so it works for client-facing processes (OTD) and internal
 *  ones (GSTR1) alike without any FMS-specific fields hardcoded here. */
function caseSummaryBlock(cfg, caseData){
  const headlineKeys = cfg.headlineKeys || [cfg.intake[0].key];
  const headline = headlineKeys.map(k=>caseData[k]).filter(Boolean).join(" · ") || (caseData.id||"—");
  const gridFields = cfg.intake.filter(f=>!headlineKeys.includes(f.key));
  const gridHtml = gridFields.map(f=>{
    const v = caseData[f.key];
    return `<div class="item"><div class="k">${f.label}</div>${v? `<div class="v">${v}</div>` : `<div class="v missing">Not captured</div>`}</div>`;
  }).join("");
  return `
    <div class="client-card">
      <div class="client-name">${headline}</div>
      ${gridFields.length? `<div class="client-grid">${gridHtml}</div>` : ""}
    </div>
  `;
}

/** Renders a stage's decision/capture-field inputs. idPrefix keeps element
 *  IDs unique when multiple stages render at once (Edit mode) — normal
 *  single-active-stage view uses no prefix, matching prior behavior exactly. */
function stageAuxFieldsHtml(stage, caseData, idPrefix){
  idPrefix = idPrefix || "";
  return `
    ${stage.decision? `
    <div>
      <label>${stage.decision.label}</label>
      <select id="${idPrefix}decision_${stage.decision.key}">
        <option value="">—</option>
        ${stage.decision.options.map(o=>`<option ${caseData["decision_"+stage.decision.key]===o?"selected":""}>${o}</option>`).join("")}
      </select>
    </div>` : ""}
    ${stage.captureNumber? `
    <div>
      <label>${stage.captureNumber.label}</label>
      <input type="number" min="0" id="${idPrefix}num_${stage.captureNumber.key}" value="${caseData["num_"+stage.captureNumber.key]||""}">
    </div>` : ""}
    ${(stage.captureNumbers||[]).map(cn=>`
    <div>
      <label>${cn.label}</label>
      <input type="number" min="0" id="${idPrefix}num_${cn.key}" value="${caseData["num_"+cn.key]||""}">
    </div>`).join("")}
    ${stage.captureDate? `
    <div>
      <label>${stage.captureDate.label}</label>
      <input type="date" id="${idPrefix}date_${stage.captureDate.key}" value="${caseData["date_"+stage.captureDate.key]||""}">
    </div>` : ""}
    ${stage.captureUrl? `
    <div>
      <label>${stage.captureUrl.label}</label>
      <input type="url" id="${idPrefix}url_${stage.captureUrl.key}" value="${caseData["url_"+stage.captureUrl.key]||""}" placeholder="Paste G-Form URL">
    </div>` : ""}
    ${(stage.captureTexts||[]).map(ct=>`
    <div>
      <label>${ct.label}</label>
      <input type="${ct.type||"text"}" id="${idPrefix}text_${ct.key}" value="${caseData["text_"+ct.key]||""}">
    </div>`).join("")}
  `;
}

/** Re-derives completedOrder/activeStageNum/status/late-flags from each
 *  stage's own status_N + decision_* fields, by walking resolveNext from
 *  Stage 1. Used after Edit-mode corrections, since editing an early
 *  decision can change which stages should be on the path at all. */
function recomputeCaseState(cfg, caseData){
  caseData.completedOrder = [];
  if (caseData.status === "Cancelled") caseData.status = "Open";
  delete caseData.cancelReason;
  let current = cfg.stages[0];
  let guard = 0;
  while (current && guard < 500){
    guard++;
    const st = caseData["status_"+current.num];
    if (st !== "Done" && st !== "Not Required"){
      caseData.activeStageNum = current.num;
      return;
    }
    const planned = computePlanned(cfg, caseData, current.num);
    caseData["planned_"+current.num] = planned;
    caseData["late_"+current.num] = (st==="Done") && delayDays(planned, caseData["actual_"+current.num]) > 0;
    caseData.completedOrder.push(current.num);
    const next = cfg.resolveNext(current, caseData);
    if (next === "END"){ caseData.activeStageNum = null; return; }
    if (next === "CANCELLED"){
      caseData.status = "Cancelled";
      caseData.activeStageNum = null;
      const decisionNote = current.decision && caseData["decision_"+current.decision.key]
        ? `${current.decision.label}: ${caseData["decision_"+current.decision.key]}` : null;
      caseData.cancelReason = `This case was marked Cancelled at Stage ${current.num} (${current.title})`
        + (decisionNote ? ` — ${decisionNote}` : "") + ". No further stages apply."
        + (caseData["remarks_"+current.num] ? ` Remarks: ${caseData["remarks_"+current.num]}` : "");
      return;
    }
    current = findStage(cfg, next);
  }
  caseData.activeStageNum = current ? current.num : null;
}

async function deleteCase(fmsId, caseId){
  if (!confirm("Delete this case permanently? This can't be undone.")) return false;
  const cases = await Store.list(fmsId);
  const filtered = cases.filter(c=>c.id!==caseId);
  await Store.save(fmsId, filtered);
  return true;
}

async function renderDetail(app){
  const cfg = FMS_CONFIGS.find(c=>c.id===state.fmsId);
  const cases = await Store.list(cfg.id);
  const caseData = cases.find(c=>c.id===state.caseId);
  if (!caseData){ state.view="list"; return render(); }
  // migrate any case created before the explicit-cursor model
  if (caseData.activeStageNum === undefined) caseData.activeStageNum = cfg.stages[0].num;
  if (!caseData.completedOrder) caseData.completedOrder = [];

  if (state.caseEditMode) return renderDetailEdit(app, cfg, cases, caseData);

  app.innerHTML = `
    <div class="toolbar"><h2 style="margin:0;">${cfg.name} — Case Detail</h2>
      ${isAdmin()? '<button class="btn secondary small" id="editCaseBtn">✏️ Edit Case</button>' : ""}</div>
    ${caseSummaryBlock(cfg, caseData)}
    ${dataSourceNote(cfg)}
    <div id="stagesWrap"></div>
  `;
  const wrap = document.getElementById("stagesWrap");
  if (isAdmin()) document.getElementById("editCaseBtn").onclick = ()=>{ state.caseEditMode = true; render(); };

  if (isCaseCancelled(caseData)){
    const reason = caseData.cancelReason || "This case was marked Cancelled. No further stages apply.";
    wrap.innerHTML = `<div class="cancelled-banner">${reason}</div>`;
    return;
  }

  // ---- completed stages, in the order this case actually traversed them ----
  let lastSection = null;
  caseData.completedOrder.forEach(num=>{
    const stage = findStage(cfg, num);
    if (stage.sectionStart && stage.sectionStart !== lastSection){
      const head = document.createElement("div");
      head.className = "stage section-head";
      head.textContent = stage.sectionStart;
      wrap.appendChild(head);
      lastSection = stage.sectionStart;
    }
    const wasLate = !!caseData["late_"+num];
    const notRequired = caseData["status_"+num] === "Not Required";
    const div = document.createElement("div");
    div.className = "stage done-row" + (wasLate? " was-late":"");
    const decisionTxt = stage.decision && caseData["decision_"+stage.decision.key]
      ? " · "+stage.decision.label+": "+caseData["decision_"+stage.decision.key] : "";
    const remarksTxt = caseData["remarks_"+num] ? ` · Remarks: ${caseData["remarks_"+num]}` : "";
    div.innerHTML = `
      <div class="stage-badge" style="${notRequired? "background:#8b98a3!important;":""}">${wasLate? "!" : notRequired? "–" : "✓"}</div>
      <div class="stage-body" style="display:flex;align-items:center;gap:10px;">
        <div>
          <div class="stage-title">${stage.num}. ${stage.title}</div>
          <div class="stage-meta">${stage.doer}${decisionTxt}${remarksTxt}</div>
        </div>
        <div class="done-date">${wasLate? "Delayed · " : notRequired? "" : ""}${notRequired? "Not Required" : "Done "+(caseData["actual_"+num]||"")}</div>
      </div>
    `;
    wrap.appendChild(div);
  });

  const stage = activeStage(cfg, caseData);

  if (!stage){
    const banner = document.createElement("div");
    banner.className = "cancelled-banner";
    banner.style.background = "#e2f6ec"; banner.style.borderColor = "#bfe6cf"; banner.style.color = "var(--ok)";
    banner.textContent = `All stages complete — this ${cfg.caseLabel.toLowerCase()} has finished the ${cfg.name} process.`;
    wrap.appendChild(banner);
    return;
  }

  if (stage.sectionStart && stage.sectionStart !== lastSection){
    const head = document.createElement("div");
    head.className = "stage section-head";
    head.textContent = stage.sectionStart;
    wrap.appendChild(head);
  }

  if (!canActOnStage(stage)){
    const planned = caseData["planned_"+stage.num] || computePlanned(cfg, caseData, stage.num);
    const overdue = delayDays(planned) > 0;
    const div = document.createElement("div");
    div.className = "stage locked";
    div.innerHTML = `
      <div class="stage-badge">🔒</div>
      <div class="stage-body">
        <div class="stage-title">${stage.num}. ${stage.title}</div>
        <div class="lock-note">View only — assigned to <b>${stage.doer}</b>. Planned: ${planned}${overdue? " (overdue)":""}. Sign in as the assigned person to update this stage.</div>
      </div>
    `;
    wrap.appendChild(div);
    return;
  }

  const planned = caseData["planned_"+stage.num] || computePlanned(cfg, caseData, stage.num);
  const overdue = delayDays(planned) > 0;
  const stageRuleRemarks = stage.remarksRequiredWhen ? stage.remarksRequiredWhen(caseData) : false;
  const remarksRequired = overdue || stageRuleRemarks;

  if (overdue){
    const ob = document.createElement("div");
    ob.className = "overdue-banner";
    ob.textContent = `⚠ This stage is past its Planned date (${planned}). A remark is required before it can be marked Done.`;
    wrap.appendChild(ob);
  }

  const div = document.createElement("div");
  div.className = "stage active" + (overdue? " overdue":"");
  div.innerHTML = `
    <div class="stage-badge" style="background:${overdue? "var(--late)" : stageColor(stage.num)}">${stage.num}</div>
    <div class="stage-body">
      <div class="stage-title">${stage.title}</div>
      <div class="stage-meta"><b>${stage.doer}</b> · ${stage.how} · ${stage.plannedMode === "dueDateOffset" ? "Planned: "+Math.abs(stage.offsetDays||0)+" day"+(Math.abs(stage.offsetDays||0)===1?"":"s")+(stage.offsetDays<0? " before " : stage.offsetDays>0 ? " after " : " on ")+(cfg.intake.find(f=>f.key===stage.baseKey)?.label || stage.baseKey) : stage.dueDay? "Due day "+stage.dueDay+(stage.monthOffset? " of the following month" : " of the month") : stage.slaKey? "SLA: "+(stage.captureNumber? "set below" : (stage.slaDefault||0)+"d default") : "SLA "+stage.sla+"d"}</div>
      ${stage.links && stage.links.length ? `<div style="margin:4px 0 10px;font-size:11.5px;">${stage.links.map(l=>`<a href="${l.url}" target="_blank" rel="noopener" style="color:#0a6fa8;font-weight:700;text-decoration:none;margin-right:14px;">↗ ${l.label}</a>`).join("")}</div>` : ""}
      <div class="stage-fields">
        <div><label>Planned</label><div class="ro">${planned}</div></div>
        <div><label>Actual</label><input type="date" id="actual_${stage.num}" value="${caseData["actual_"+stage.num]||""}"></div>
        <div><label>Status</label>
          <select id="status_${stage.num}">
            <option>Pending</option><option>In Progress</option><option>Done</option><option>Not Required</option>
          </select>
        </div>
        <div><label>Delay</label><div class="ro"><span class="delay-tag ${overdue?"late":"none"}">${overdue? delayDays(planned)+"d late" : "On time"}</span></div></div>
        ${stageAuxFieldsHtml(stage, caseData)}
        <div class="full">
          <label>Remarks${remarksRequired? " * (required)":" (optional)"}</label>
          <textarea id="remarks_${stage.num}" placeholder="${stageRuleRemarks? (stage.num===3 ? "Record the agreed deviation / revised PO details" : "Explain why this stage requires a remark and the revised plan") : overdue? "Why is this stage delayed, and what's the revised plan?" : "Any notes for this stage"}">${caseData["remarks_"+stage.num]||""}</textarea>
        </div>
      </div>
    </div>
  `;
  wrap.appendChild(div);

  const nextInfo = document.createElement("div");
  nextInfo.className = "stage locked";
  nextInfo.innerHTML = `<div class="stage-badge">🔒</div><div class="stage-title">Next stage</div><div class="lock-note">Unlocks once this stage is saved as Done</div>`;
  wrap.appendChild(nextInfo);

  const saveBar = document.createElement("div");
  saveBar.className = "toolbar";
  saveBar.innerHTML = `<div></div><button class="btn" id="saveStagesBtn">Save this stage</button>`;
  wrap.appendChild(saveBar);

  document.getElementById("saveStagesBtn").onclick = async ()=>{
    const actualEl = document.getElementById("actual_"+stage.num);
    const statusEl = document.getElementById("status_"+stage.num);
    const remarksEl = document.getElementById("remarks_"+stage.num);
    const decEl = stage.decision ? document.getElementById("decision_"+stage.decision.key) : null;
    const numEl = stage.captureNumber ? document.getElementById("num_"+stage.captureNumber.key) : null;
    const numElsPlural = (stage.captureNumbers||[]).map(cn=>({cn, el:document.getElementById("num_"+cn.key)}));
    const dateEl = stage.captureDate ? document.getElementById("date_"+stage.captureDate.key) : null;

    // keep whatever the user typed even if they don't finalize yet
    caseData["actual_"+stage.num] = actualEl.value;
    caseData["remarks_"+stage.num] = remarksEl.value.trim();
    if (decEl) caseData["decision_"+stage.decision.key] = decEl.value;
    if (numEl) caseData["num_"+stage.captureNumber.key] = numEl.value;
    numElsPlural.forEach(({cn,el})=>{ if (el) caseData["num_"+cn.key] = el.value; });
    if (dateEl) caseData["date_"+stage.captureDate.key] = dateEl.value;
    const urlEl = stage.captureUrl ? document.getElementById("url_"+stage.captureUrl.key) : null;
    if (urlEl) caseData["url_"+stage.captureUrl.key] = urlEl.value.trim();
    const textElsPlural = (stage.captureTexts||[]).map(ct=>({ct, el:document.getElementById("text_"+ct.key)}));
    textElsPlural.forEach(({ct,el})=>{ if (el) caseData["text_"+ct.key] = el.value.trim(); });
    caseData["planned_"+stage.num] = planned;

    const finalizing = statusEl.value === "Done" || statusEl.value === "Not Required";

    if (finalizing){
      if (stage.decision && !decEl.value){
        alert(`Please set "${stage.decision.label}" before proceeding from this stage.`);
        return;
      }
      if (stage.captureNumber && !numEl.value){
        alert(`Please enter "${stage.captureNumber.label}" before proceeding from this stage.`);
        return;
      }
      for (const {cn,el} of numElsPlural){
        if (!el.value){
          alert(`Please enter "${cn.label}" before proceeding from this stage.`);
          return;
        }
      }
      const liveStageRuleRemarks = stage.remarksRequiredWhen ? stage.remarksRequiredWhen(caseData) : false;

      if (statusEl.value === "Done"){
        if (!actualEl.value) caseData["actual_"+stage.num] = today();
        const finalDelay = delayDays(planned, caseData["actual_"+stage.num]);
        if ((finalDelay > 0 || liveStageRuleRemarks) && !remarksEl.value.trim()){
          alert(liveStageRuleRemarks
            ? (stage.num===8 && cfg.id==="otd" ? `Plate Dispatch is "No" — please add a remark before proceeding. Your Process Coordinator uses these remarks to review delays.` : "Please add the required remark before proceeding. Your Process Coordinator uses these remarks to review the case.")
            : "This stage is past its Planned date — please add a remark before marking it Done. Your Process Coordinator uses these remarks to review delays.");
          return;
        }
        caseData["late_"+stage.num] = finalDelay > 0;
      } else {
        // Not Required — nothing was actually done, so no delay applies
        if (!caseData["actual_"+stage.num]) caseData["actual_"+stage.num] = today();
        caseData["late_"+stage.num] = false;
      }
      caseData["status_"+stage.num] = statusEl.value;
      caseData.completedOrder.push(stage.num);
      const next = cfg.resolveNext(stage, caseData);
      caseData.activeStageNum = (next === "END" || next === "CANCELLED") ? null : next;
      if (next === "CANCELLED"){
        caseData.status = "Cancelled";
        const decisionNote = stage.decision && caseData["decision_"+stage.decision.key]
          ? `${stage.decision.label}: ${caseData["decision_"+stage.decision.key]}` : null;
        caseData.cancelReason = `This case was marked Cancelled at Stage ${stage.num} (${stage.title})`
          + (decisionNote ? ` — ${decisionNote}` : "") + ". No further stages apply."
          + (caseData["remarks_"+stage.num] ? ` Remarks: ${caseData["remarks_"+stage.num]}` : "");
      }
    } else {
      caseData["status_"+stage.num] = statusEl.value;
    }

    const idx = cases.findIndex(c=>c.id===caseData.id);
    cases[idx] = caseData;
    await Store.save(cfg.id, cases);
    render();
  };

  // live-update the remarks requirement label as the decision changes, without losing unsaved input
  if (stage.remarksRequiredWhen && stage.decision){
    const decEl = document.getElementById("decision_"+stage.decision.key);
    const labelEl = div.querySelector(`#remarks_${stage.num}`).previousElementSibling;
    const textareaEl = document.getElementById("remarks_"+stage.num);
    decEl.addEventListener("change", ()=>{
      const tempCase = Object.assign({}, caseData, {["decision_"+stage.decision.key]: decEl.value});
      const nowRequired = overdue || stage.remarksRequiredWhen(tempCase);
      labelEl.textContent = "Remarks" + (nowRequired ? " * (required)" : " (optional)");
      textareaEl.placeholder = stage.remarksRequiredWhen(tempCase)
        ? (stage.num===3 ? "Record the agreed deviation / revised PO details" : "Explain why this stage requires a remark and the revised plan")
        : (overdue ? "Why is this stage delayed, and what's the revised plan?" : "Any notes for this stage");
    });
  }
}

/** Edit mode: every intake field and every stage is unlocked at once for
 *  correction (not gated by the normal sequential/remarks-required rules —
 *  this is a deliberate administrative override). Saving re-derives the
 *  case's path via recomputeCaseState, so a corrected decision correctly
 *  changes which stages are considered active/skipped. */
function renderDetailEdit(app, cfg, cases, caseData){
  if (!isAdmin()){ state.caseEditMode = false; return render(); }
  app.innerHTML = `
    <div class="toolbar"><h2 style="margin:0;">${cfg.name} — Editing Case</h2>
      <button class="btn secondary small" id="cancelEditBtn">Cancel</button></div>

    <div id="editStagesWrap"></div>
    <div class="toolbar">
      <button class="btn secondary" id="deleteCaseBtn" style="background:#fdecec;color:var(--late);border-color:#f3b8bd;">🗑 Delete this case</button>
      <div>

  const intakeCard = document.getElementById("editIntakeCard");
  intakeCard.innerHTML = `<div class="field-grid">

      if (f.type==="select"){
        return `<div><label>${f.label}</label><select id="edit_in_${f.key}">
          <option value="">— Select —</option>
          ${f.options.map(o=>`<option ${caseData[f.key]===o?"selected":""}>${o}</option>`).join("")}
        </select></div>`;
      }
      return `<div><label>${f.label}</label><input type="${f.type||"text"}" id="edit_in_${f.key}" value="${caseData[f.key]||""}"></div>`;
    }).join("")}
  </div>`;

  const stagesWrap = document.getElementById("editStagesWrap");
  cfg.stages.forEach(stage=>{
    const status = caseData["status_"+stage.num] || "Pending";
    const div = document.createElement("div");
    div.className = "stage";
    div.innerHTML = `
      <div class="stage-badge" style="background:${stageColor(stage.num)}">${stage.num}</div>
      <div class="stage-body">
        <div class="stage-title">${stage.title}</div>
        <div class="stage-meta"><b>${stage.doer}</b>${stage.how? " · "+stage.how : ""}</div>
        <div class="stage-fields">
          <div><label>Actual</label><input type="date" id="edit_actual_${stage.num}" value="${caseData["actual_"+stage.num]||""}"></div>
          <div><label>Status</label>
            <select id="edit_status_${stage.num}">
              <option ${status==="Pending"?"selected":""}>Pending</option>
              <option ${status==="In Progress"?"selected":""}>In Progress</option>
              <option ${status==="Done"?"selected":""}>Done</option>
              <option ${status==="Not Required"?"selected":""}>Not Required</option>
            </select>
          </div>
          ${stageAuxFieldsHtml(stage, caseData, `edit_s${stage.num}_`)}
          <div class="full">
            <label>Remarks</label>
            <textarea id="edit_remarks_${stage.num}">${caseData["remarks_"+stage.num]||""}</textarea>
          </div>
        </div>
      </div>
    `;
    stagesWrap.appendChild(div);
  });

  function exitEdit(){ state.caseEditMode = false; render(); }
  document.getElementById("cancelEditBtn").onclick = exitEdit;
  document.getElementById("cancelEditBtn2").onclick = exitEdit;

  document.getElementById("deleteCaseBtn").onclick = async ()=>{
    const ok = await deleteCase(cfg.id, caseData.id);
    if (ok){ state.caseEditMode=false; state.view="list"; state.caseId=null; render(); }
  };

  document.getElementById("saveEditBtn").onclick = async ()=>{
    cfg.intake.forEach(f=>{
      const el = document.getElementById("edit_in_"+f.key);
      if (el) caseData[f.key] = el.value.trim ? el.value.trim() : el.value;
    });
    cfg.stages.forEach(stage=>{
      caseData["actual_"+stage.num] = document.getElementById("edit_actual_"+stage.num).value;
      caseData["status_"+stage.num] = document.getElementById("edit_status_"+stage.num).value;
      caseData["remarks_"+stage.num] = document.getElementById("edit_remarks_"+stage.num).value.trim();
      const p = `edit_s${stage.num}_`;
      if (stage.decision){
        const el = document.getElementById(p+"decision_"+stage.decision.key);
        if (el) caseData["decision_"+stage.decision.key] = el.value;
      }
      if (stage.captureNumber){
        const el = document.getElementById(p+"num_"+stage.captureNumber.key);
        if (el) caseData["num_"+stage.captureNumber.key] = el.value;
      }
      (stage.captureNumbers||[]).forEach(cn=>{
        const el = document.getElementById(p+"num_"+cn.key);
        if (el) caseData["num_"+cn.key] = el.value;
      });
      if (stage.captureDate){
        const el = document.getElementById(p+"date_"+stage.captureDate.key);
        if (el) caseData["date_"+stage.captureDate.key] = el.value;
      }
      if (stage.captureUrl){
        const el = document.getElementById(p+"url_"+stage.captureUrl.key);
        if (el) caseData["url_"+stage.captureUrl.key] = el.value.trim();
      }
      (stage.captureTexts||[]).forEach(ct=>{
        const el = document.getElementById(p+"text_"+ct.key);
        if (el) caseData["text_"+ct.key] = el.value.trim();
      });
    });

    recomputeCaseState(cfg, caseData);

    const idx = cases.findIndex(c=>c.id===caseData.id);
    cases[idx] = caseData;
    await Store.save(cfg.id, cases);
    state.caseEditMode = false;
    render();
  };
}
// Splits a combined doer label like "CRE & OSC", "OSC/CRE", "Stores Incharge/PS",
// or "SH / Asst. SH/ Sundar (Recording), OSC" into individual doer names, so
// the audit filter lists each person/role once regardless of how stages
// happen to have combined or ordered them.
function splitDoers(doerStr){
  if (!doerStr) return [];
  return doerStr.split(/\s*(?:&|\/|,)\s*/).map(s=>s.trim()).filter(Boolean);
}

async function renderAudit(app){
  const cfg = FMS_CONFIGS.find(c=>c.id===state.fmsId);
  const cases = await Store.list(cfg.id);
  const rows = [];

  cases.forEach(c=>{
    // stages already completed late — key by position in this case's own
    // traversal history, since a looped stage (e.g. a rework cycle) can
    // appear more than once and each occurrence is its own delay to review
    (c.completedOrder||[]).forEach((num, idx)=>{
      if (c["late_"+num]){
        const stage = findStage(cfg, num);
        const key = `closed:${idx}:${num}`;
        const audit = (c.auditedDelays||{})[key];
        rows.push({
          caseId: c.id, key,
          caseLabel: c[cfg.intake[0].key]||c.id, client: c.clientName||"—",
          stageNum: num, stageTitle: stage.title, doer: stage.doer,
          planned: c["planned_"+num], actual: c["actual_"+num],
          delay: delayDays(c["planned_"+num], c["actual_"+num]),
          remarks: c["remarks_"+num]||"", isOpen:false,
          audited: !!audit, auditedAt: audit? audit.at : null
        });
      }
    });
    // the currently-active stage, if it's overdue right now
    const stage = activeStage(cfg, c);
    if (stage){
      const planned = c["planned_"+stage.num] || computePlanned(cfg, c, stage.num);
      const d = delayDays(planned);
      if (d > 0){
        const key = `open:${stage.num}`;
        const audit = (c.auditedDelays||{})[key];
        rows.push({
          caseId: c.id, key,
          caseLabel: c[cfg.intake[0].key]||c.id, client: c.clientName||"—",
          stageNum: stage.num, stageTitle: stage.title, doer: stage.doer,
          planned, actual: "— (still open)", delay: d,
          remarks: c["remarks_"+stage.num]||"", isOpen:true,
          audited: !!audit, auditedAt: audit? audit.at : null
        });
      }
    }
  });

  const doers = [...new Set(rows.flatMap(r=>splitDoers(r.doer)))].sort();

  app.innerHTML = `
    <h2>Delay audit — ${cfg.name}</h2>
    <div class="sub">Every stage that missed its Planned date, with the Doer responsible and their remarks — filter by Doer to prep a delay review. Once you've taken a delay to Management, mark it audited so next time only fresh delays show up.</div>
    <div class="toolbar">
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
        <span><label style="display:inline;margin-right:8px;">Filter by Doer</label>
        <select id="doerFilter" style="width:auto;display:inline-block;">
          <option value="">All Doers</option>
          ${doers.map(d=>`<option>${d}</option>`).join("")}
        </select></span>
        <label style="font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;">
          <input type="checkbox" id="showAudited" style="width:auto;"> Show audited (closed) delays
        </label>
      </div>
      <div></div>
    </div>
    <div id="auditSummary"></div>
    <div id="auditTable"></div>
  `;

  async function markAudited(caseId, key){
    const freshCases = await Store.list(cfg.id);
    const idx = freshCases.findIndex(c=>c.id===caseId);
    if (idx===-1) return;
    freshCases[idx].auditedDelays = freshCases[idx].auditedDelays || {};
    freshCases[idx].auditedDelays[key] = { at: today() };
    await Store.save(cfg.id, freshCases);
    renderAudit(document.getElementById("app"));
  }

  function countBy(list, getKeys){
    const counts = {};
    list.forEach(r=>{
      getKeys(r).forEach(k=>{
        counts[k] = (counts[k]||0) + 1;
      });
    });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  }

  function breakdownCard(title, entries){
    if (!entries.length) return `<div class="kpi"><div class="lbl" style="margin-bottom:8px;">${title}</div><div style="font-size:12px;color:var(--muted);">None</div></div>`;
    return `<div class="kpi">
      <div class="lbl" style="margin-bottom:8px;">${title}</div>
      <div style="max-height:160px;overflow-y:auto;">
        ${entries.map(([name,count])=>`
          <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px solid #f0f4f7;">
            <span>${name}</span><span style="font-weight:700;color:var(--late);">${count}</span>
          </div>`).join("")}
      </div>
    </div>`;
  }

  function draw(filterDoer, showAudited){
    let filtered = filterDoer ? rows.filter(r=>splitDoers(r.doer).includes(filterDoer)) : rows;
    filtered = showAudited ? filtered : filtered.filter(r=>!r.audited);

    const summaryWrap = document.getElementById("auditSummary");
    const byStage = countBy(filtered, r=>[`${r.stageNum}. ${r.stageTitle}`]);
    const byDoer = countBy(filtered, r=>splitDoers(r.doer));
    const byClient = countBy(filtered, r=>[r.client||"—"]);
    summaryWrap.innerHTML = `
      <div class="kpi-row">
        <div class="kpi late"><div class="num">${filtered.length}</div><div class="lbl">Total Delays</div></div>
        ${breakdownCard("By Stage", byStage)}
        ${breakdownCard("By Doer", byDoer)}
        ${breakdownCard("By Client", byClient)}
      </div>
    `;

    const tableWrap = document.getElementById("auditTable");
    if (!filtered.length){
      tableWrap.innerHTML = `<div class="card empty">No ${showAudited? "" : "open "}delays ${filterDoer? "for "+filterDoer : ""} — nothing to review.</div>`;
      return;
    }
    tableWrap.innerHTML = `<table>
      <thead><tr>
        <th>Sl.No</th><th>${cfg.caseLabel}</th><th>Client</th><th>Stage</th><th>Doer</th>
        <th>Planned</th><th>Actual</th><th>Delay</th><th>Remarks</th><th></th>
      </tr></thead>
      <tbody>
        ${filtered.map((r,i)=>`<tr>
          <td>${i+1}</td>
          <td>${r.caseLabel}</td><td>${r.client}</td>
          <td>${r.stageNum}. ${r.stageTitle}</td><td>${r.doer}</td>
          <td>${r.planned}</td><td>${r.actual}</td>
          <td><span class="status-chip late">${r.delay}d ${r.isOpen?"(open)":""}</span></td>
          <td>${r.remarks || "<i style='color:var(--muted)'>none</i>"}</td>
          <td>${r.audited
            ? `<span class="status-chip done">Audited ${r.auditedAt||""}</span>`
            : `<button class="btn small secondary" data-idx="${i}">Mark Audited</button>`}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
    tableWrap.querySelectorAll("button[data-idx]").forEach(btn=>{
      btn.onclick = ()=>{
        const r = filtered[Number(btn.dataset.idx)];
        markAudited(r.caseId, r.key);
      };
    });
  }
  draw("");
  document.getElementById("doerFilter").onchange = (e)=>draw(e.target.value);
}
